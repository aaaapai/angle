name: MTL31 AUDIT

on:
  push:
    branches: [develop, metal-only, 'mtl31/**']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      # Checks 6 and 8 compare against the feature registry, which deliberately lives outside the
      # ANGLE checkout.  CI still enforces the Metal 2-only, zero-emulation, and comment checks.
      - name: L0 static audit
        run: bash scripts/mtl31_audit.sh
